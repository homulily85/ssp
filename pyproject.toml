[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssp-sat"
version = "0.1.0"
description = "Exact SAT solver for the Job Sequencing and Tool Switching Problem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-sat",
]

[project.scripts]
ssp-sat = "src.cli:main"

[tool.setuptools]
packages = ["src"]
